<h1>Reservations</h1>

<table border="1">
<tr>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Date</th>
<th>Time</th>
<th>Guests</th>
<th>Status</th>
</tr>

{% for r in rows %}

<td>{{ r[3] }}</td>

<td>{{ r[5] }}</td>
<td>{{ r[6] }}</td>

</tr>
{% endfor %}
</table>
