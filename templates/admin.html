<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
</head>

<body>

<h1>Reservations</h1>

<table border="1">

<tr>
<th>Name</th>
<th>Phone</th>
<th>Date</th>
<th>Time</th>
<th>Guests</th>
</tr>

{% for r in reservations %}

<tr>
<td>{{ r[1] }}</td>
<td>{{ r[2] }}</td>
<td>{{ r[3] }}</td>
<td>{{ r[4] }}</td>
<td>{{ r[5] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
